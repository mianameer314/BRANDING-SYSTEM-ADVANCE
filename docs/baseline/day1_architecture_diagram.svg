<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">O2Geeks Branding System - Day 1 Current Architecture</title>
  <desc id="desc">Vercel-hosted Admin and Website connect to a Railway-hosted FastAPI backend, which connects to PostgreSQL, Redis, S3 media storage, OpenRouter AI, and outbound webhooks.</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#102a43"/>
      <stop offset="1" stop-color="#1d4e89"/>
    </linearGradient>
    <linearGradient id="api" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#146c94"/>
      <stop offset="1" stop-color="#0b4f6c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#102a43" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58708a"/>
    </marker>
    <style>
      .title { font: 700 35px Arial, Helvetica, sans-serif; fill: #ffffff; }
      .subtitle { font: 400 17px Arial, Helvetica, sans-serif; fill: #d9e6f2; }
      .section { font: 700 18px Arial, Helvetica, sans-serif; fill: #102a43; letter-spacing: 1px; }
      .node-title { font: 700 21px Arial, Helvetica, sans-serif; fill: #102a43; }
      .node-body { font: 400 16px Arial, Helvetica, sans-serif; fill: #486581; }
      .api-title { font: 700 28px Arial, Helvetica, sans-serif; fill: #ffffff; }
      .api-body { font: 400 17px Arial, Helvetica, sans-serif; fill: #d7eef9; }
      .label { font: 600 14px Arial, Helvetica, sans-serif; fill: #334e68; }
      .small { font: 400 14px Arial, Helvetica, sans-serif; fill: #627d98; }
    </style>
  </defs>

  <rect width="1600" height="1040" fill="#f5f8fc"/>
  <rect x="0" y="0" width="1600" height="115" fill="url(#header)"/>
  <text x="70" y="52" class="title">O2Geeks Branding System</text>
  <text x="70" y="83" class="subtitle">Day 1 Current Production Baseline | Controlled Editorial Backend - Week 1</text>
  <text x="1370" y="52" text-anchor="middle" class="subtitle">DEPLOYED</text>
  <text x="1370" y="82" text-anchor="middle" class="subtitle">Railway + Vercel</text>

  <text x="75" y="165" class="section">CLIENT APPLICATIONS</text>
  <text x="665" y="165" class="section">HEADLESS CMS</text>
  <text x="1080" y="165" class="section">PLATFORM SERVICES</text>

  <!-- Client application nodes -->
  <g filter="url(#shadow)">
    <rect x="70" y="195" rx="18" width="400" height="155" fill="#ffffff" stroke="#bed2e5" stroke-width="2"/>
    <rect x="70" y="195" rx="18" width="12" height="155" fill="#2f80ed"/>
    <text x="105" y="246" class="node-title">Admin Dashboard</text>
    <text x="105" y="278" class="node-body">React + Vite | Vercel</text>
    <text x="105" y="308" class="node-body">JWT-authenticated content management</text>
    <text x="105" y="333" class="node-body">Live preview parent window</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="70" y="430" rx="18" width="400" height="155" fill="#ffffff" stroke="#bed2e5" stroke-width="2"/>
    <rect x="70" y="430" rx="18" width="12" height="155" fill="#00a778"/>
    <text x="105" y="481" class="node-title">Public Website</text>
    <text x="105" y="513" class="node-body">Nuxt 3 | Vercel</text>
    <text x="105" y="543" class="node-body">Public content rendering and media display</text>
    <text x="105" y="568" class="node-body">Secure preview iframe consumer</text>
  </g>

  <!-- API node -->
  <g filter="url(#shadow)">
    <rect x="600" y="260" rx="24" width="395" height="280" fill="url(#api)"/>
    <text x="797" y="327" text-anchor="middle" class="api-title">FastAPI Headless CMS</text>
    <text x="797" y="362" text-anchor="middle" class="api-body">Railway deployment</text>
    <line x1="660" y1="392" x2="935" y2="392" stroke="#7fc4dd" stroke-width="1"/>
    <text x="797" y="428" text-anchor="middle" class="api-body">REST / OpenAPI</text>
    <text x="797" y="458" text-anchor="middle" class="api-body">JWT + RBAC + rate limits</text>
    <text x="797" y="488" text-anchor="middle" class="api-body">Preview, AI generation, webhooks</text>
  </g>

  <!-- Arrows from clients -->
  <path d="M470 272 C520 272 540 320 600 338" fill="none" stroke="#58708a" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="492" y="247" rx="8" width="122" height="38" fill="#e6f0f7"/>
  <text x="553" y="271" text-anchor="middle" class="label">JWT REST API</text>
  <path d="M470 506 C525 506 545 478 600 458" fill="none" stroke="#58708a" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="491" y="493" rx="8" width="147" height="38" fill="#e6f0f7"/>
  <text x="565" y="517" text-anchor="middle" class="label">Public API / preview</text>

  <!-- Service nodes -->
  <g filter="url(#shadow)">
    <rect x="1090" y="190" rx="16" width="380" height="105" fill="#ffffff" stroke="#bed2e5" stroke-width="2"/>
    <rect x="1090" y="190" rx="16" width="10" height="105" fill="#6c63ff"/>
    <text x="1120" y="232" class="node-title">PostgreSQL</text>
    <text x="1120" y="261" class="node-body">Content, users, webhooks, audit data</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1090" y="330" rx="16" width="380" height="105" fill="#ffffff" stroke="#bed2e5" stroke-width="2"/>
    <rect x="1090" y="330" rx="16" width="10" height="105" fill="#e6522c"/>
    <text x="1120" y="372" class="node-title">Redis</text>
    <text x="1120" y="401" class="node-body">Rate-limiting state</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1090" y="470" rx="16" width="380" height="105" fill="#ffffff" stroke="#bed2e5" stroke-width="2"/>
    <rect x="1090" y="470" rx="16" width="10" height="105" fill="#ffb000"/>
    <text x="1120" y="512" class="node-title">S3 Object Storage</text>
    <text x="1120" y="541" class="node-body">Images, media, downloadable resources</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1090" y="610" rx="16" width="380" height="105" fill="#ffffff" stroke="#bed2e5" stroke-width="2"/>
    <rect x="1090" y="610" rx="16" width="10" height="105" fill="#0aa6a6"/>
    <text x="1120" y="652" class="node-title">OpenRouter AI</text>
    <text x="1120" y="681" class="node-body">Structured content generation</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1090" y="750" rx="16" width="380" height="105" fill="#ffffff" stroke="#bed2e5" stroke-width="2"/>
    <rect x="1090" y="750" rx="16" width="10" height="105" fill="#2f80ed"/>
    <text x="1120" y="792" class="node-title">Outbound Webhooks</text>
    <text x="1120" y="821" class="node-body">HMAC-signed content.published events</text>
  </g>

  <!-- API service connectors -->
  <path d="M995 315 C1040 315 1040 242 1090 242" fill="none" stroke="#58708a" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M995 360 C1040 360 1040 382 1090 382" fill="none" stroke="#58708a" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M995 405 C1040 405 1040 522 1090 522" fill="none" stroke="#58708a" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M995 450 C1040 450 1040 662 1090 662" fill="none" stroke="#58708a" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M995 495 C1040 495 1040 802 1090 802" fill="none" stroke="#58708a" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Content domain -->
  <rect x="70" y="685" rx="20" width="925" height="255" fill="#edf5fa" stroke="#9fbcd2" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="105" y="730" class="section">CMS CONTENT DOMAIN (SHARED FASTAPI LIFECYCLE)</text>
  <text x="105" y="760" class="small">Current common state: draft or published | Week 1 adds controlled editorial states, revisions, and audit trails.</text>
  <g>
    <rect x="105" y="800" rx="14" width="145" height="78" fill="#ffffff" stroke="#bed2e5" stroke-width="2"/>
    <rect x="275" y="800" rx="14" width="145" height="78" fill="#ffffff" stroke="#bed2e5" stroke-width="2"/>
    <rect x="445" y="800" rx="14" width="145" height="78" fill="#ffffff" stroke="#bed2e5" stroke-width="2"/>
    <rect x="615" y="800" rx="14" width="145" height="78" fill="#ffffff" stroke="#bed2e5" stroke-width="2"/>
    <rect x="785" y="800" rx="14" width="160" height="78" fill="#ffffff" stroke="#bed2e5" stroke-width="2"/>
    <text x="178" y="847" text-anchor="middle" class="node-title">Blogs</text>
    <text x="348" y="847" text-anchor="middle" class="node-title">News</text>
    <text x="518" y="847" text-anchor="middle" class="node-title">Projects</text>
    <text x="688" y="847" text-anchor="middle" class="node-title">Insights</text>
    <text x="865" y="847" text-anchor="middle" class="node-title">Case Studies</text>
  </g>
  <path d="M797 540 L797 685" fill="none" stroke="#58708a" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="820" y="620" class="label">content APIs</text>

  <text x="70" y="990" class="small">Day 1 evidence: Railway health healthy, PostgreSQL connected, S3 storage active, Super Admin access confirmed, and draft content correctly hidden from public visitors.</text>
</svg>
