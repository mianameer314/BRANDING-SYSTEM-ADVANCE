name: Frontend CI

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'admin/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'admin/**'

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./admin

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './admin/package-lock.json'

    - name: Install Dependencies
      run: npm ci

    - name: Fix Git Case Sensitivity
      run: |
        if [ -d "src/Lib" ]; then
          echo "Found uppercase Lib, renaming to lib..."
          mv src/Lib src/lib
        fi

    - name: Run Build Check
      run: npm run build
