<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="910" viewBox="0 0 1600 910" role="img" aria-labelledby="title desc">
  <title id="title">Controlled Editorial Lifecycle Transition Diagram</title>
  <desc id="desc">Allowed lifecycle transitions among draft, review, approval, scheduling, publication, unpublication, and archive states.</desc>
  <defs><linearGradient id="h" x1="0" x2="1"><stop stop-color="#102a43"/><stop offset="1" stop-color="#1d4e89"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#58708a"/></marker><style>.t{font:700 34px Arial;fill:#fff}.s{font:400 17px Arial;fill:#d9e6f2}.n{font:700 18px Arial;fill:#102a43}.b{font:400 14px Arial;fill:#486581}.l{font:600 13px Arial;fill:#334e68}</style></defs>
  <rect width="1600" height="910" fill="#f5f8fc"/><rect width="1600" height="115" fill="url(#h)"/><text x="65" y="52" class="t">Controlled Editorial Lifecycle</text><text x="65" y="83" class="s">All arrows are allowed transitions. Published is the only public state.</text>
  <g fill="none" stroke="#58708a" stroke-width="3" marker-end="url(#a)"><path d="M300 270 H470"/><path d="M620 270 H790"/><path d="M940 270 H1110"/><path d="M1260 270 H1410"/><path d="M1230 350 C1230 470 1040 490 940 510"/><path d="M790 510 H620"/><path d="M470 510 H300"/><path d="M220 350 C220 470 300 590 470 640"/><path d="M770 350 C770 455 650 470 620 510"/><path d="M1090 350 C1090 450 970 470 940 510"/><path d="M1410 270 C1515 285 1515 650 1280 680"/></g>
  <g><rect x="120" y="210" width="180" height="120" rx="18" fill="#fff7e6" stroke="#f1c46b" stroke-width="2"/><text x="210" y="258" text-anchor="middle" class="n">Draft</text><text x="210" y="285" text-anchor="middle" class="b">Editable internal work</text><rect x="470" y="210" width="150" height="120" rx="18" fill="#edf4ff" stroke="#9cbfe8" stroke-width="2"/><text x="545" y="258" text-anchor="middle" class="n">In Review</text><text x="545" y="285" text-anchor="middle" class="b">Editor submits work</text><rect x="790" y="210" width="150" height="120" rx="18" fill="#e6f7f1" stroke="#8bd7bf" stroke-width="2"/><text x="865" y="258" text-anchor="middle" class="n">Approved</text><text x="865" y="285" text-anchor="middle" class="b">Approve permission</text><rect x="1110" y="210" width="150" height="120" rx="18" fill="#f1edff" stroke="#b6a4ee" stroke-width="2"/><text x="1185" y="258" text-anchor="middle" class="n">Scheduled</text><text x="1185" y="285" text-anchor="middle" class="b">Publish permission</text><rect x="1410" y="210" width="150" height="120" rx="18" fill="#e6f7f1" stroke="#55bd93" stroke-width="2"/><text x="1485" y="258" text-anchor="middle" class="n">Published</text><text x="1485" y="285" text-anchor="middle" class="b">Publicly visible</text><rect x="1110" y="620" width="180" height="120" rx="18" fill="#eef1f4" stroke="#aebac5" stroke-width="2"/><text x="1200" y="668" text-anchor="middle" class="n">Unpublished</text><text x="1200" y="695" text-anchor="middle" class="b">Removed from public</text><rect x="790" y="450" width="150" height="120" rx="18" fill="#fff0f0" stroke="#e7aaaa" stroke-width="2"/><text x="865" y="498" text-anchor="middle" class="n">Changes Requested</text><text x="865" y="525" text-anchor="middle" class="b">Needs revision</text><rect x="470" y="620" width="150" height="120" rx="18" fill="#eef1f4" stroke="#aebac5" stroke-width="2"/><text x="545" y="668" text-anchor="middle" class="n">Archived</text><text x="545" y="695" text-anchor="middle" class="b">Retired content</text></g>
  <g class="l"><text x="377" y="250">submit</text><text x="690" y="250">approve</text><text x="1013" y="250">schedule</text><text x="1334" y="250">publish</text><text x="1050" y="455">unpublish</text><text x="690" y="490">request changes</text><text x="375" y="490">revise</text><text x="350" y="585">archive</text><text x="655" y="435">request changes</text><text x="980" y="435">request changes</text><text x="1385" y="600">archive</text></g>
  <text x="70" y="835" class="b">Other allowed paths: Draft → Published or Archived; Changes Requested → Draft / In Review / Archived; Approved → Published / Archived; Scheduled → Approved / Archived; Unpublished → Draft / Archived; Archived → Draft.</text>
</svg>
