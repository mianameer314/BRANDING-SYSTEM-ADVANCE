name: Backend CI

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'requirements.txt'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'requirements.txt'

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: branding_cms
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_NAME: "O2geeks Headless CMS"
      APP_ENV: "test"
      DEBUG: "True"
      LOG_LEVEL: "INFO"
      DATABASE_URL: "postgresql://user:password@localhost:5432/branding_cms"
      JWT_SECRET: "test_secret_key"
      JWT_ALGORITHM: "HS256"
      JWT_ACCESS_EXPIRY_MINUTES: "30"
      JWT_REFRESH_EXPIRY_DAYS: "7"
      ADMIN_EMAIL: "admin@example.com"
      ADMIN_PASSWORD: "test"
      CORS_ORIGINS: "*"
      STORAGE_PROVIDER: "local"
      MEDIA_URL: "/media"
      LOCAL_STORAGE_PATH: "storage"
      AWS_ACCESS_KEY_ID: "test"
      AWS_SECRET_ACCESS_KEY: "test"
      AWS_REGION: "us-east-1"
      AWS_BUCKET_NAME: "test"
      AWS_ENDPOINT_URL: "test"
      MAX_IMAGE_SIZE_MB: "5"
      MAX_FILE_SIZE_MB: "20"
      IMAGE_MAX_WIDTH: "1920"
      ALLOWED_IMAGE_TYPES: ".jpg,.png"
      REDIS_URL: "redis://localhost:6379"
      RATE_LIMIT_LOGIN: "5/60"
      RATE_LIMIT_REGISTER: "3/60"
      RATE_LIMIT_REFRESH: "20/60"
      RATE_LIMIT_PUBLIC_GET: "120/60"
      RATE_LIMIT_AUTH_GET: "300/60"
      RATE_LIMIT_CREATE: "20/60"
      RATE_LIMIT_UPDATE: "30/60"
      RATE_LIMIT_DELETE: "10/60"
      RATE_LIMIT_UPLOAD: "10/60"
      RATE_LIMIT_COMMENT: "30/60"
      RATE_LIMIT_LIKE: "60/60"
      RATE_LIMIT_USER_MGT: "10/60"

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest python-dotenv

    - name: Run Pytest
      run: |
        cp .env.example .env
        python -m pytest tests -q
